<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentOS - Sistema Inteligente para Clínicas Odontológicas</title>
    <meta name="description" content="DentOS é o sistema operacional inteligente para clínicas odontológicas. Gerencie pacientes, procedimentos, campanhas e muito mais." />
    <meta name="author" content="DentOS" />

    <meta property="og:title" content="DentOS - Sistema Inteligente para Clínicas" />
    <meta property="og:description" content="O sistema operacional inteligente para clínicas odontológicas. Gerencie pacientes, procedimentos, campanhas e muito mais." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      /* Loading screen - shown while JS bundle loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .loader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse-logo 2s ease-in-out infinite;
      }
      #app-loader .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loader .loader-text {
        margin-top: 16px;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-logo {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <svg class="loader-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
        <path d="M35 30 Q50 20 65 30 Q75 40 70 55 Q65 70 50 75 Q35 70 30 55 Q25 40 35 30Z" fill="#6366f1" opacity="0.8"/>
        <text x="50" y="58" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="sans-serif">D</text>
      </svg>
      <div class="loader-spinner"></div>
      <p class="loader-text">Carregando DentOS...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when React renders
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
