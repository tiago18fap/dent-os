<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentOS - Sistema Inteligente para Clínicas Odontológicas</title>
    <meta name="description" content="DentOS é o sistema operacional inteligente para clínicas odontológicas. Gerencie pacientes, procedimentos, campanhas e muito mais." />
    <meta name="author" content="DentOS" />

    <meta property="og:title" content="DentOS - Sistema Inteligente para Clínicas" />
    <meta property="og:description" content="O sistema operacional inteligente para clínicas odontológicas. Gerencie pacientes, procedimentos, campanhas e muito mais." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Loading screen - shown while JS bundle loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .loader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse-logo 2s ease-in-out infinite;
      }
      #app-loader .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(57, 255, 20, 0.2);
        border-top-color: #39FF14;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loader .loader-text {
        margin-top: 16px;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-logo {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <svg class="loader-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 10 L5 90 L40 90 C65 90 82 72 82 50 C82 28 65 10 40 10 Z M22 27 L38 27 C56 27 65 36 65 50 C65 64 56 73 38 73 L22 73 Z" fill="white"/>
        <circle cx="72" cy="50" r="28" stroke="#39FF14" stroke-width="9" fill="none"/>
      </svg>
      <div class="loader-spinner"></div>
      <p class="loader-text">Carregando DentOS...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader when React renders
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
